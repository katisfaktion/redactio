[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactio-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "python-docx>=1.2,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]
