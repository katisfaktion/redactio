[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactio-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "presidio-analyzer>=2.2.362,<3",
    "pyyaml>=6.0,<7",
    "python-docx>=1.2,<2",
    "spacy>=3.8,<3.9",
    "tldextract>=5.3,<6",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*"]
ignore_missing_imports = true
